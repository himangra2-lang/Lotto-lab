name: Fetch draw results

on:
  schedule:
    # Every 6 hours: keeps results current and finishes the history backfill in a few days
    - cron: "17 3,9,15,21 * * *"
  # Also runs whenever the fetcher changes (this kicks off the first full backfill)
  push:
    branches: [main]
    paths:
      - "fetcher/**"
      - ".github/workflows/fetch-draws.yml"
  workflow_dispatch:
    inputs:
      retry_failed:
        description: "Retry past dates that failed before"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: fetcher/requirements.txt
      - run: pip install -r fetcher/requirements.txt
      - name: Fetch
        run: python fetcher/fetch.py ${{ github.event.inputs.retry_failed == 'true' && '--retry-failed' || '' }}
      - name: Commit updated data
        run: |
          git config user.name "lotto-lab-bot"
          git config user.email "lotto-lab-bot@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "data: update draws $(date -u +%F)"
          git pull --rebase -q && git push
